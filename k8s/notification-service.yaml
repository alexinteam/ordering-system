# PostgreSQL для Notification Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-notifications
  namespace: notification-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-notifications
  template:
    metadata:
      labels:
        app: postgres-notifications
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "notifications"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-notifications
  namespace: notification-system
spec:
  selector:
    app: postgres-notifications
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
# Notification Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: notification-system
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-notifications.notification-system.svc.cluster.local -p 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: notification-service
        image: alexinteam/notification-service:latest
        ports:
        - containerPort: 8085
        env:
        - name: DB_HOST
          value: "postgres-notifications.notification-system.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DB_NAME
          value: "notifications"
        - name: DB_SSL_MODE
          value: "disable"
        - name: RABBITMQ_URL
          value: "amqp://admin:admin@rabbitmq.infrastructure.svc.cluster.local:5672/"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: notification-system
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
  type: ClusterIP