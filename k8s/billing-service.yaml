# PostgreSQL для Billing Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-billing
  namespace: billing-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-billing
  template:
    metadata:
      labels:
        app: postgres-billing
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "billing"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-billing
  namespace: billing-system
spec:
  selector:
    app: postgres-billing
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
# Billing Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-billing.billing-system.svc.cluster.local -p 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: billing-service
        image: alexinteam/billing-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: DB_HOST
          value: "postgres-billing.billing-system.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DB_NAME
          value: "billing"
        - name: PORT
          value: "8082"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: billing-system
spec:
  selector:
    app: billing-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP