# PostgreSQL для Delivery Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-delivery
  namespace: delivery-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-delivery
  template:
    metadata:
      labels:
        app: postgres-delivery
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "delivery"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-delivery
  namespace: delivery-system
spec:
  selector:
    app: postgres-delivery
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
# Delivery Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: delivery-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-delivery.delivery-system.svc.cluster.local -p 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: delivery-service
        image: alexinteam/delivery-service:latest
        ports:
        - containerPort: 8084
        env:
        - name: DB_HOST
          value: "postgres-delivery.delivery-system.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DB_NAME
          value: "delivery"
        - name: PORT
          value: "8084"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: delivery-system
spec:
  selector:
    app: delivery-service
  ports:
  - port: 8084
    targetPort: 8084
  type: ClusterIP