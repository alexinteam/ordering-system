<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .user { fill: #e1f5fe; stroke: #01579b; stroke-width: 2px; }
            .service { fill: #f3e5f5; stroke: #4a148c; stroke-width: 2px; }
            .infra { fill: #e8f5e8; stroke: #1b5e20; stroke-width: 2px; }
            .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
            .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
            .arrow { stroke: #333; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
            .saga-arrow { stroke: #ff6b6b; stroke-width: 2px; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>

    <!-- User -->
    <circle cx="80" cy="80" r="30" class="user"/>
    <text x="80" y="85" class="text">👤 User</text>

    <!-- API Gateway -->
    <rect x="150" y="50" width="100" height="60" rx="10" class="service"/>
    <text x="200" y="75" class="text">🌐 API Gateway</text>
    <text x="200" y="90" class="text">:8080</text>

    <!-- Order Service -->
    <rect x="150" y="150" width="100" height="60" rx="10" class="service"/>
    <text x="200" y="175" class="text">📦 Order Service</text>
    <text x="200" y="190" class="text">:8081 (Saga)</text>

    <!-- Services -->
    <rect x="50" y="250" width="80" height="50" rx="5" class="service"/>
    <text x="90" y="270" class="text">💳 Billing</text>
    <text x="90" y="285" class="text">:8082</text>

    <rect x="150" y="250" width="80" height="50" rx="5" class="service"/>
    <text x="190" y="270" class="text">📦 Warehouse</text>
    <text x="190" y="285" class="text">:8083</text>

    <rect x="250" y="250" width="80" height="50" rx="5" class="service"/>
    <text x="290" y="270" class="text">🚚 Delivery</text>
    <text x="290" y="285" class="text">:8084</text>

    <rect x="350" y="250" width="80" height="50" rx="5" class="service"/>
    <text x="390" y="270" class="text">📧 Notification</text>
    <text x="390" y="285" class="text">:8085</text>

    <!-- Infrastructure -->
    <rect x="450" y="150" width="100" height="60" rx="10" class="infra"/>
    <text x="500" y="175" class="text">🗄️ PostgreSQL</text>
    <text x="500" y="190" class="text">:5432</text>

    <rect x="450" y="250" width="100" height="50" rx="5" class="infra"/>
    <text x="500" y="270" class="text">🐰 RabbitMQ</text>
    <text x="500" y="285" class="text">:5672</text>

    <!-- Connections -->
    <!-- User to Gateway -->
    <line x1="110" y1="80" x2="150" y2="80" class="arrow"/>

    <!-- Gateway to Order Service -->
    <line x1="200" y1="110" x2="200" y2="150" class="arrow"/>

    <!-- Gateway to Services -->
    <line x1="200" y1="110" x2="90" y2="250" class="arrow"/>
    <line x1="200" y1="110" x2="190" y2="250" class="arrow"/>
    <line x1="200" y1="110" x2="290" y2="250" class="arrow"/>
    <line x1="200" y1="110" x2="390" y2="250" class="arrow"/>

    <!-- Saga connections -->
    <line x1="150" y1="180" x2="90" y2="250" class="saga-arrow"/>
    <line x1="150" y1="180" x2="190" y2="250" class="saga-arrow"/>
    <line x1="150" y1="180" x2="290" y2="250" class="saga-arrow"/>
    <line x1="150" y1="180" x2="390" y2="250" class="saga-arrow"/>

    <!-- Database connections -->
    <line x1="250" y1="180" x2="450" y2="180" class="arrow"/>
    <line x1="90" y1="275" x2="450" y2="180" class="arrow"/>
    <line x1="190" y1="275" x2="450" y2="180" class="arrow"/>
    <line x1="290" y1="275" x2="450" y2="180" class="arrow"/>
    <line x1="390" y1="275" x2="450" y2="180" class="arrow"/>

    <!-- RabbitMQ connections -->
    <line x1="250" y1="180" x2="450" y2="250" class="arrow"/>
    <line x1="390" y1="275" x2="450" y2="275" class="arrow"/>

    <!-- Saga Steps Labels -->
    <text x="120" y="200" class="text" style="font-size: 10px;">1. Payment</text>
    <text x="120" y="215" class="text" style="font-size: 10px;">2. Reserve</text>
    <text x="120" y="230" class="text" style="font-size: 10px;">3. Delivery</text>
    <text x="120" y="245" class="text" style="font-size: 10px;">4. Notify</text>
</svg>
